<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6fed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>郑航小白</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">郑</span>
        <div>
          <h1>郑航小白</h1>
          <p>郑州航空工业管理学院 · 校园助手</p>
        </div>
      </div>
    </header>

    <main>
      <section id="page-home" class="page active">
        <div class="card hero">
          <div class="hero-line">
            <span id="home-week" class="hero-week">第 12 周</span>
            <span id="home-semester" class="muted">第一学期</span>
          </div>
          <p id="home-countdown" class="muted"></p>
          <div id="home-upcoming" class="upcoming idle"></div>
        </div>

        <div class="card">
          <h2>今天课程</h2>
          <ul id="home-courses" class="course-list"></ul>
        </div>

        <div class="card">
          <h2>快捷入口</h2>
          <div id="home-links" class="chips"></div>
          <p class="muted small">点击在新标签打开</p>
        </div>
      </section>

      <section id="page-week" class="page">
        <div class="card">
          <h2 id="week-title"></h2>
          <p id="week-s1" class="muted"></p>
          <p class="muted small">校历规则：9 月 7 日为第 1 周，每周一进入新一周</p>
        </div>
        <div class="card">
          <h2>学期周次</h2>
          <div id="week-list" class="week-grid"></div>
        </div>
      </section>

      <section id="page-timetable" class="page">
        <div class="card">
          <h2>我的课表</h2>
          <div class="actions">
            <button id="btn-import" class="btn">导入课表</button>
            <button id="btn-clear" class="btn ghost">清空</button>
          </div>
          <div id="import-panel" class="hidden">
            <textarea id="import-text" rows="6" placeholder="每行一门课：&#10;周一 1-2 高等数学 3号教学楼101 1-16周&#10;周二 3-4 大学英语 5号教学楼203 1-8周"></textarea>
            <button id="btn-save-import" class="btn">保存课表</button>
            <p class="muted small">课表只保存在本机浏览器；手机端暂不支持直接登录教务系统。</p>
          </div>
        </div>
        <div class="card grid-card">
          <div id="grid" class="grid"></div>
        </div>
      </section>

      <section id="page-campus" class="page">
        <div id="campus"></div>
      </section>

      <section id="page-me" class="page">
        <div class="card">
          <h2>常用入口</h2>
          <div id="links" class="chips"></div>
        </div>
        <div class="card">
          <h2>关于</h2>
          <p class="muted small">
            郑航小白 · 手机版。数据整理于 2026-11，来源为学校官网与公开资料；实时信息请以官网为准。
            与学校官方无关，仅供学习与校园信息查询。
          </p>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="home">首页</button>
      <button class="nav-btn" data-tab="week">校历</button>
      <button class="nav-btn" data-tab="timetable">课表</button>
      <button class="nav-btn" data-tab="campus">校园</button>
      <button class="nav-btn" data-tab="me">我的</button>
    </nav>

    <script src="./app.js"></script>
  </body>
</html>
